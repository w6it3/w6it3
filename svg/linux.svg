<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes tuxWave {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-12deg); }
      60% { transform: rotate(12deg); }
    }
    .tux-body { animation: tuxWave 2.8s infinite ease-in-out; transform-origin: 50px 70px; }
  </style>
  <g class="tux-body">
    <ellipse cx="50" cy="55" rx="30" ry="35" fill="#000000"/>
    <ellipse cx="50" cy="60" rx="20" ry="25" fill="#FFFFFF"/>
    <circle cx="42" cy="35" r="4" fill="#FFFFFF"/>
    <circle cx="58" cy="35" r="4" fill="#FFFFFF"/>
    <circle cx="43" cy="35" r="2" fill="#000000"/>
    <circle cx="57" cy="35" r="2" fill="#000000"/>
    <polygon points="45,40 55,40 50,48" fill="#FFA500"/>
  </g>
</svg>
