<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes beamDash {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ringGlow {
      0%, 100% { stroke: #333333; filter: drop-shadow(0 0 2px #FFFFFF); }
      50% { stroke: #FFFFFF; filter: drop-shadow(0 0 10px #FFFFFF); }
    }
    .beam { stroke-dasharray: 120; animation: beamDash 2.5s infinite ease-in-out; }
    .ring-outer { animation: ringGlow 3s infinite linear; }
  </style>
  <g>
    <circle cx="50" cy="50" r="44" fill="#000000" class="ring-outer" stroke-width="3"/>
    <path d="M 32 28 L 32 72" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <path class="beam" d="M 32 28 L 68 72" stroke="url(#nextGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 68 28 L 68 52" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <defs>
      <linearGradient id="nextGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
      </linearGradient>
    </defs>
  </g>
</svg>
