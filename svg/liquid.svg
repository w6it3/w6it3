<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes dropFall {
      0% { transform: translateY(-5px) scale(0.9); opacity: 0; }
      50% { transform: translateY(5px) scale(1.05); opacity: 1; }
      100% { transform: translateY(12px) scale(0.95); opacity: 0; }
    }
    @keyframes rippleExpand {
      0% { r: 10px; opacity: 1; }
      100% { r: 38px; opacity: 0; }
    }
    .liquid-drop { animation: dropFall 2.2s infinite ease-in; }
    .liquid-ripple { animation: rippleExpand 2.2s infinite ease-out; }
  </style>
  <circle cx="50" cy="72" r="10" fill="none" stroke="#54B9EB" stroke-width="3" class="liquid-ripple"/>
  <g class="liquid-drop">
    <path d="M 50 15 C 50 15, 76 52, 76 65 C 76 79, 64 88, 50 88 C 36 88, 24 79, 24 65 C 24 52, 50 15, 50 15 Z" fill="#54B9EB"/>
    <path d="M 40 42 C 34 52, 34 62, 36 68" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
