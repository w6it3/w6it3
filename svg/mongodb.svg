<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes mongoSway {
      0%, 100% { transform: rotate(-4deg); filter: drop-shadow(0 0 2px rgba(19, 170, 82, 0.4)); }
      50% { transform: rotate(4deg); filter: drop-shadow(0 0 8px rgba(19, 170, 82, 0.9)); }
    }
    .mongo-icon { animation: mongoSway 3.2s infinite ease-in-out; transform-origin: 50px 92px; }
  </style>
  <g class="mongo-icon">
    <path d="M 50 8 C 50 8, 20 42, 20 64 C 20 80, 34 92, 50 92 Z" fill="#13AA52"/>
    <path d="M 50 8 C 50 8, 80 42, 80 64 C 80 80, 66 92, 50 92 Z" fill="#116149"/>
    <path d="M 50 8 L 50 92" stroke="#001E2B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 50 16 C 50 16, 32 46, 32 64" fill="none" stroke="#69D08D" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
