<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes canvaPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #00C4CC); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 12px #7D2AE8); }
    }
    .canva-badge { animation: canvaPulse 3s infinite ease-in-out; transform-origin: 50px 50px; }
  </style>
  <circle cx="50" cy="50" r="44" fill="url(#canvaGrad)" class="canva-badge"/>
  <defs>
    <linearGradient id="canvaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4CC"/>
      <stop offset="100%" stop-color="#7D2AE8"/>
    </linearGradient>
  </defs>
  <text x="50" y="60" font-family="'Brush Script MT', cursive, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Canva</text>
</svg>
