<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes rocketThrust {
      0%, 100% { transform: translate(-3px, 3px); }
      50% { transform: translate(3px, -3px); }
    }
    .postman-rocket { animation: rocketThrust 1.8s infinite ease-in-out; }
  </style>
  <g class="postman-rocket">
    <circle cx="50" cy="50" r="44" fill="#FF6C37"/>
    <path d="M 30 65 L 70 35 M 42 40 L 70 35 L 65 63" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="65" r="5" fill="#FFFFFF"/>
  </g>
</svg>
