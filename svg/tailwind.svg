<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes windFlow1 {
      0%, 100% { transform: translateX(0) scaleY(1); }
      50% { transform: translateX(5px) scaleY(1.08); }
    }
    @keyframes windFlow2 {
      0%, 100% { transform: translateX(0) scaleY(1); }
      50% { transform: translateX(-5px) scaleY(0.92); }
    }
    .wave1 { animation: windFlow1 2.2s infinite ease-in-out; transform-origin: center; fill: #38BDF8; }
    .wave2 { animation: windFlow2 2.2s infinite ease-in-out; transform-origin: center; fill: #06B6D4; }
  </style>
  <g>
    <path class="wave1" d="M 25 45 C 30 32, 42 30, 52 40 C 60 48, 68 50, 75 42 C 70 55, 58 58, 48 48 C 40 40, 32 38, 25 45 Z"/>
    <path class="wave2" d="M 10 65 C 15 52, 27 50, 37 60 C 45 68, 53 70, 60 62 C 55 75, 43 78, 33 68 C 25 60, 17 58, 10 65 Z"/>
  </g>
</svg>
