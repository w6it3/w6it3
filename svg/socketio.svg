<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes orbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes lightningZap {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #FFFFFF); }
      25% { opacity: 0.3; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #FFFFFF); }
      75% { opacity: 0.5; }
    }
    .orbit { animation: orbitSpin 6s infinite linear; transform-origin: 50px 50px; }
    .bolt-zap { animation: lightningZap 1.5s infinite linear; }
  </style>
  <circle cx="50" cy="50" r="44" fill="#010101" stroke="#222222" stroke-width="2"/>
  <circle class="orbit" cx="50" cy="50" r="36" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14 10 4 10"/>
  <path class="bolt-zap" d="M 54 18 L 26 54 L 48 54 L 44 82 L 74 46 L 52 46 Z" fill="#FFFFFF"/>
</svg>
