<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px rgba(102, 204, 51, 0.4)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 12px rgba(102, 204, 51, 0.95)); }
    }
    .node-icon { animation: nodePulse 3s infinite ease-in-out; transform-origin: center; }
  </style>
  <g class="node-icon">
    <path d="M 50 10 L 85 30 L 85 70 L 50 90 L 15 70 L 15 30 Z" fill="#339933"/>
    <path d="M 50 10 L 85 30 L 50 50 L 15 30 Z" fill="#66CC33" opacity="0.4"/>
    <text x="50" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">JS</text>
  </g>
</svg>
