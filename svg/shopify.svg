    <path d="M 22 35 L 45 92 L 25 92 Z" fill="#5E8E3E" opacity="0.4"/>
    <path d="M 52 46 C 45 46, 42 50, 42 54 C 42 62, 58 62, 58 70 C 58 76, 51 78, 45 76 M 52 42 L 52 80" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
