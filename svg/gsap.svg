<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes elasticWobble {
      0%, 100% { transform: scale(1, 1); }
      30% { transform: scale(1.12, 0.88); }
      60% { transform: scale(0.92, 1.08); }
      80% { transform: scale(1.04, 0.96); }
    }
    .gsap-elastic { animation: elasticWobble 2.5s infinite ease-in-out; transform-origin: 50px 50px; }
  </style>
  <g class="gsap-elastic">
    <circle cx="50" cy="50" r="44" fill="#0D1117" stroke="#88CE02" stroke-width="3.5"/>
    <text x="50" y="58" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="bold" fill="#88CE02" text-anchor="middle">GSAP</text>
  </g>
</svg>
