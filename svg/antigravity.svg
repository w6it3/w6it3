<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes antiGravityFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); filter: drop-shadow(0 0 4px #58A6FF); }
      50% { transform: translateY(-6px) rotate(180deg); filter: drop-shadow(0 0 14px #8957E5); }
    }
    .antigravity-core { animation: antiGravityFloat 4s infinite ease-in-out; transform-origin: 50px 50px; }
  </style>
  <g class="antigravity-core">
    <circle cx="50" cy="50" r="44" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="32" fill="none" stroke="#8957E5" stroke-width="3" stroke-dasharray="12 8"/>
    <path d="M 50 24 L 68 70 L 56 70 L 50 54 L 44 70 L 32 70 Z M 50 42 L 44 58 L 56 58 Z" fill="#FFFFFF"/>
  </g>
</svg>
