<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes cursorGlow {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.4)); transform: translateY(0); }
      50% { filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.95)); transform: translateY(-3px); }
    }
    .cursor-logo { animation: cursorGlow 2.8s infinite ease-in-out; }
  </style>
  <g class="cursor-logo">
    <circle cx="50" cy="50" r="44" fill="#000000" stroke="#333333" stroke-width="2"/>
    <path d="M 50 18 L 80 35 L 80 65 L 50 82 L 20 65 L 20 35 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 50 18 L 50 50 M 80 35 L 50 50 M 20 35 L 50 50" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
