<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    @keyframes expressGlow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.3)); }
      50% { filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9)); }
    }
    .express-icon { animation: expressGlow 2.8s infinite ease-in-out; }
  </style>
  <g class="express-icon">
    <circle cx="50" cy="50" r="44" fill="#000000" stroke="#333333" stroke-width="2"/>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ex</text>
  </g>
</svg>
